<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión – ElhyAI Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .login-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:2rem 1.5rem; background:var(--navy); position:relative; overflow:hidden; }
    .login-page::before { content:''; position:fixed; top:-200px; left:50%; transform:translateX(-50%); width:900px; height:900px; background:radial-gradient(ellipse, rgba(32,96,192,0.12) 0%, transparent 65%); pointer-events:none; }
    .particles { position:fixed; inset:0; pointer-events:none; z-index:0; }
    .particle { position:absolute; width:2px; height:2px; background:var(--gold); border-radius:50%; opacity:0; animation:floatUp linear infinite; }
    .particle:nth-child(1){left:10%;animation-duration:8s;animation-delay:0s;width:3px;height:3px;}
    .particle:nth-child(2){left:25%;animation-duration:10s;animation-delay:2s;}
    .particle:nth-child(3){left:40%;animation-duration:7s;animation-delay:1s;background:var(--blue-glow);}
    .particle:nth-child(4){left:60%;animation-duration:9s;animation-delay:3s;}
    .particle:nth-child(5){left:80%;animation-duration:6s;animation-delay:0.5s;width:3px;height:3px;}
    @keyframes floatUp{0%{opacity:0;transform:translateY(100vh) scale(0);}10%{opacity:0.6;}90%{opacity:0.3;}100%{opacity:0;transform:translateY(-100px) scale(1.5);}}
    .login-card { position:relative; z-index:10; width:100%; max-width:440px; background:var(--glass); border:1px solid var(--glass-border); border-radius:20px; padding:2.75rem 2.25rem; backdrop-filter:blur(20px); box-shadow:0 24px 80px rgba(0,0,0,0.4); animation:cardIn 0.5s cubic-bezier(0.4,0,0.2,1) both; }
    @keyframes cardIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
    .login-logo{text-align:center;margin-bottom:2rem;}
    .login-logo a{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;color:var(--white);}
    .login-logo a span{color:var(--gold);}
    .login-logo p{color:var(--grey);font-size:0.8rem;margin-top:0.3rem;}
    .login-title{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:0.4rem;}
    .login-sub{color:var(--grey-light);font-size:0.85rem;text-align:center;margin-bottom:1.75rem;}
    .btn-google{width:100%;padding:0.8rem;border-radius:10px;border:1.5px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.05);color:var(--white);font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.75rem;transition:all var(--transition);margin-bottom:1.25rem;}
    .btn-google:hover{background:rgba(255,255,255,0.1);}
    .divider{display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08);}
    .divider span{font-size:0.75rem;color:var(--grey);}
    .form-group{margin-bottom:1.1rem;}
    .form-label{font-size:0.78rem;font-weight:600;color:var(--grey-light);text-transform:uppercase;letter-spacing:0.8px;display:block;margin-bottom:0.4rem;}
    .input-wrap{position:relative;}
    .input-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--grey);font-size:0.85rem;}
    .form-input{width:100%;padding:0.85rem 1rem 0.85rem 2.5rem;background:rgba(10,22,40,0.8);border:1.5px solid rgba(201,168,76,0.12);border-radius:10px;color:var(--white);font-family:'DM Sans',sans-serif;font-size:0.9rem;transition:border-color 0.2s;}
    .form-input::placeholder{color:var(--grey);}
    .form-input:focus{outline:none;border-color:var(--gold);}
    .password-toggle{position:absolute;right:1rem;top:50%;transform:translateY(-50%);color:var(--grey);cursor:pointer;background:none;font-size:0.85rem;}
    .form-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem;}
    .remember-check{display:flex;align-items:center;gap:0.5rem;font-size:0.82rem;color:var(--grey-light);cursor:pointer;}
    .remember-check input{accent-color:var(--gold);}
    .forgot-link{font-size:0.82rem;color:var(--gold);}
    .forgot-link:hover{text-decoration:underline;}
    .btn-login{width:100%;padding:0.9rem;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));color:var(--navy);font-weight:800;font-size:0.95rem;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:0.5rem;margin-bottom:1.5rem;}
    .btn-login:hover{opacity:0.88;transform:translateY(-2px);}
    .btn-login:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
    .btn-spinner{width:16px;height:16px;border:2px solid rgba(5,13,26,0.3);border-top-color:var(--navy);border-radius:50%;animation:spin 0.7s linear infinite;display:none;}
    .loading .btn-spinner{display:block;}
    .loading .btn-text{display:none;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .register-link{text-align:center;font-size:0.85rem;color:var(--grey);}
    .register-link a{color:var(--gold);font-weight:600;}
    .alert{padding:0.75rem 1rem;border-radius:8px;font-size:0.83rem;margin-bottom:1rem;display:none;}
    .alert.show{display:flex;align-items:center;gap:0.5rem;}
    .alert-error{background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.25);color:#e74c3c;}
    .demo-badge{background:rgba(32,96,192,0.1);border:1px solid rgba(32,96,192,0.2);border-radius:8px;padding:0.75rem 1rem;font-size:0.78rem;color:var(--grey-light);margin-bottom:1.25rem;}
    .demo-badge strong{color:var(--gold);}
    .demo-fill{color:var(--blue-glow);cursor:pointer;font-size:0.75rem;float:right;}
  </style>
</head>
<body>
<div class="particles">
  <div class="particle"></div><div class="particle"></div>
  <div class="particle"></div><div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <a href="index.html">Elhy<span>AI</span></a>
      <p>Plataforma de Capacitaciones</p>
    </div>
    <h1 class="login-title">Bienvenido de vuelta</h1>
    <p class="login-sub">Ingresa a tu cuenta para continuar aprendiendo</p>

    <div class="alert alert-error" id="alert-error">
      <i class="fas fa-exclamation-circle"></i>
      <span id="error-msg">Error</span>
    </div>

    <button class="btn-google" onclick="loginGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20H24v8h11.3C33.6 33.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20c11 0 19.7-8 19.7-20 0-1.3-.1-2.7-.1-4z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3 0 5.7 1.1 7.8 2.9l5.7-5.7C34 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.5-5l-6.2-5.2C29.3 35.3 26.8 36 24 36c-5.2 0-9.6-3.4-11.2-8.1l-6.5 5C9.5 39.5 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2C40.8 35.6 44 30.3 44 24c0-1.3-.1-2.7-.4-4z"/></svg>
      Continuar con Google
    </button>

    <div class="divider"><span>o inicia con tu correo</span></div>

    <div class="demo-badge">
      <span class="demo-fill" onclick="fillDemo()">Usar demo →</span>
      Demo: <strong>demo@elhyai.com</strong> / <strong>Demo1234!</strong>
    </div>

    <div class="form-group">
      <label class="form-label">Correo electrónico</label>
      <div class="input-wrap">
        <input type="email" class="form-input" id="login-email" placeholder="tu@correo.com" autocomplete="email" />
        <i class="input-icon fas fa-envelope"></i>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <div class="input-wrap">
        <input type="password" class="form-input" id="login-password" placeholder="Tu contraseña" autocomplete="current-password" />
        <i class="input-icon fas fa-lock"></i>
        <button class="password-toggle" onclick="togglePass()" type="button">
          <i class="fas fa-eye" id="pass-eye"></i>
        </button>
      </div>
    </div>

    <div class="form-row">
      <label class="remember-check">
        <input type="checkbox" id="remember-me" /> Recordarme
      </label>
      <a href="recuperar.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
    </div>

    <button class="btn-login" id="btn-login" onclick="loginEmail()">
      <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Iniciar sesión</span>
      <div class="btn-spinner"></div>
    </button>

    <div class="register-link">
      ¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase.js"></script>
<script>
/* ── Auth guard SIN loop ── */
let redirecting = false;
ElhyFirebase.onAuthStateChanged(async (user) => {
  if (user && !redirecting) {
    redirecting = true;
    try {
      const profile = await ElhyFirebase.getUserProfile(user.uid);
      localStorage.setItem('elhyai_user', JSON.stringify({
        uid: user.uid,
        name: user.displayName || profile?.name || 'Usuario',
        email: user.email,
        role: profile?.role || 'student'
      }));
    } catch(e) {}
    window.location.replace('dashboard.html');
  }
});

async function loginEmail() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  hideAlert();
  if (!email || !password) { showError('Completa todos los campos'); return; }
  setLoading(true);
  try {
    await ElhyFirebase.loginUser(email, password);
  } catch(e) {
    setLoading(false);
    showError(firebaseErrorMsg(e.code));
  }
}

async function loginGoogle() {
  hideAlert();
  try {
    await ElhyFirebase.loginWithGoogle();
  } catch(e) {
    if (e.code !== 'auth/popup-closed-by-user') showError(firebaseErrorMsg(e.code));
  }
}

function togglePass() {
  const f = document.getElementById('login-password');
  const e = document.getElementById('pass-eye');
  f.type = f.type === 'password' ? 'text' : 'password';
  e.className = f.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
}

function fillDemo() {
  document.getElementById('login-email').value    = 'demo@elhyai.com';
  document.getElementById('login-password').value = 'Demo1234!';
}

function setLoading(on) {
  const btn = document.getElementById('btn-login');
  btn.classList.toggle('loading', on);
  btn.disabled = on;
}

function showError(msg) {
  document.getElementById('error-msg').textContent = msg;
  document.getElementById('alert-error').classList.add('show');
}
function hideAlert() {
  document.getElementById('alert-error').classList.remove('show');
}

function firebaseErrorMsg(code) {
  const msgs = {
    'auth/user-not-found':     'No existe una cuenta con ese correo',
    'auth/wrong-password':     'Contraseña incorrecta',
    'auth/invalid-email':      'Correo electrónico inválido',
    'auth/too-many-requests':  'Demasiados intentos. Espera unos minutos',
    'auth/user-disabled':      'Esta cuenta ha sido deshabilitada',
    'auth/invalid-credential': 'Correo o contraseña incorrectos',
  };
  return msgs[code] || 'Error al iniciar sesión. Intenta nuevamente';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') loginEmail();
  });
});
</script>
</body>
</html>
